name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/central_marketing
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/central_marketing_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/central_marketing_e2e
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Criar bancos
        run: |
          for db in central_marketing central_marketing_test central_marketing_e2e; do
            PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE $db;"
          done
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrações (Prisma nativo) e sincronia schema × migrações
        run: |
          pnpm db:migrate:deploy
          pnpm db:migrate:check
      - run: pnpm test
      - run: pnpm build:node
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build do Cloudflare e E2E dentro do workerd
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/central_marketing_e2e
          APP_URL_PRODUCTION: http://localhost:3100
          E2E_TARGET: workers
        run: |
          pnpm build
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: test-results/
